name: Build site
on:
  workflow_dispatch:
  push:
    paths: ['tools/postprocess.py', 'tools/optimize.py', 'tools/purge.mjs', 'tools/site.js', 'tools/llms.py', 'tools/vendor/**', 'tools/.build-trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build tools
        run: |
          npm i --prefix tools --no-audit --no-fund
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
      - name: Build site/
        run: python3 tools/postprocess.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Rebuild site/" || echo "no changes"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
