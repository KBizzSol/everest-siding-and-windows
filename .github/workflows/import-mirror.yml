name: Import mirror from URL
# Used when the live host blocks GitHub runners: the mirror is made elsewhere
# (e.g. a Vercel Sandbox), served as a .tgz, and imported here.
on:
  workflow_dispatch:
  push:
    paths: ['tools/.mirror-url']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build tools
        run: |
          npm i --prefix tools --no-audit --no-fund
          python3 -m pip install --quiet --break-system-packages pillow fonttools brotli || python3 -m pip install --quiet pillow fonttools brotli
      - name: Download and extract
        run: |
          URL=$(head -1 tools/.mirror-url)
          MODE=$(sed -n 2p tools/.mirror-url)
          curl -fsSL --retry 3 "$URL" -o /tmp/mirror.tgz
          ls -la /tmp/mirror.tgz
          # "merge" on line 2 adds/updates files; otherwise the mirror is replaced
          if [ "$MODE" != "merge" ]; then rm -rf mirror; fi
          tar xzf /tmp/mirror.tgz
          echo "files: $(find mirror -type f | wc -l)"
          if grep -rlq sgcaptcha --include=index.html mirror; then echo "captcha page found, aborting"; exit 1; fi
      - name: Build site/
        run: python3 tools/postprocess.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mirror site tools
          git commit -m "Import mirror of everestsidingandwindows.com and build site/" || echo "no changes"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
